<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Là Người Nói Dối - Liar Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Inter Font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
            min-height: 100vh;
        }
        .flash {
            animation: flash 1s infinite alternate;
        }
        @keyframes flash {
            from { opacity: 1; transform: scale(1.05); }
            to { opacity: 0.7; transform: scale(1); }
        }
        /* Custom scrollbar style for better aesthetics */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #9ca3af; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background-color: #e5e7eb; }
    </style>
</head>
<body class="flex flex-col items-center p-4 sm:p-8">

    <div id="game-container" class="w-full max-w-4xl bg-white shadow-2xl rounded-xl p-6 sm:p-10 border-t-8 border-indigo-600">
        <h1 class="text-4xl font-extrabold text-gray-900 text-center mb-6 flex items-center justify-center">
            <i data-lucide="scan-eye" class="w-8 h-8 mr-3 text-indigo-600"></i>
            Ai Là Người Nói Dối
        </h1>
        <p id="room-info" class="text-center text-gray-500 mb-6"></p>

        <!-- Loading & Error Message -->
        <div id="loading" class="text-center text-indigo-600 font-medium my-8">Đang tải...</div>
        <div id="message-box" class="hidden text-center p-3 my-4 rounded-lg font-medium"></div>

        <!-- 1. Setup Screen -->
        <div id="setup-screen" class="space-y-6 hidden">
            <h2 class="text-2xl font-semibold text-gray-800 border-b pb-3 mb-4">Thiết Lập Phòng Chơi</h2>

            <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4">
                <div class="flex-1">
                    <label for="num-players" class="block text-sm font-medium text-gray-700">Tổng số Người chơi (3-15)</label>
                    <input type="number" id="num-players" value="5" min="3" max="15" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 border focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="flex-1">
                    <label for="num-liars" class="block text-sm font-medium text-gray-700">Số lượng Kẻ nói dối (Max 2)</label>
                    <input type="number" id="num-liars" value="1" min="1" max="2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 border focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>

            <div class="space-y-3" id="player-name-inputs">
                <!-- Name inputs will be injected here -->
            </div>
            
            <p id="setup-error" class="text-red-500 font-medium hidden">Lỗi thiết lập: Số lượng Liar không hợp lệ.</p>

            <button onclick="startGame()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-lg">
                Bắt Đầu Trò Chơi
            </button>
        </div>

        <!-- 2. Role/Word Reveal Screen (First Reveal after Start) -->
        <div id="reveal-screen" class="hidden text-center p-8 bg-indigo-50 rounded-lg border-2 border-indigo-300 space-y-4">
            <h2 class="text-3xl font-extrabold text-indigo-800">Thẻ Bí Mật Của Bạn</h2>
            <p id="your-role" class="text-2xl font-bold p-2 rounded-md inline-block"></p>
            <p class="text-lg text-gray-600">Từ khóa bí mật vòng này là:</p>
            <p id="secret-word" class="text-4xl font-extrabold text-gray-900 bg-white p-4 rounded-xl shadow-md border-b-4 border-yellow-500 inline-block"></p>
            <p id="liar-goal" class="text-sm italic text-red-500"></p>
            
            <button onclick="hideRevealScreen()" class="w-full mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                Đã xem - Bắt đầu miêu tả
            </button>
        </div>

        <!-- 3. Gameplay Screen -->
        <div id="gameplay-screen" class="hidden">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h2 class="text-2xl font-semibold text-gray-800">Vòng Miêu Tả</h2>
                <p id="current-category" class="text-lg font-medium text-indigo-600"></p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6 custom-scrollbar max-h-96 overflow-y-auto" id="player-list">
                <!-- Player cards will be injected here -->
            </div>

            <div id="turn-display" class="p-4 bg-yellow-50 border-l-4 border-yellow-500 rounded-lg shadow-inner mb-6">
                <p class="text-lg font-medium text-gray-800">Lượt của:</p>
                <p id="current-player-turn" class="text-3xl font-bold text-yellow-700 mt-1"></p>
                <p id="turn-order-info" class="text-sm text-gray-600 mt-2"></p>
            </div>

            <button id="next-turn-btn" onclick="nextTurn()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-lg" disabled>
                Hoàn Thành Miêu Tả (Chuyển Lượt)
            </button>
        </div>
        
        <!-- 4. Voting Screen -->
        <div id="voting-screen" class="hidden text-center">
            <h2 class="text-3xl font-extrabold text-red-700 mb-6">BỎ PHIẾU TÌM KẺ NÓI DỐI</h2>
            <p class="text-xl text-gray-700 mb-8">Hãy chọn người mà bạn nghi ngờ là Liar:</p>

            <div id="voting-options" class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-8">
                <!-- Voting buttons will be injected here -->
            </div>

            <button id="submit-vote-btn" onclick="submitVote()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-lg" disabled>
                Gửi Phiếu Bầu
            </button>
        </div>

        <!-- 5. Game Over/Result Screen -->
        <div id="result-screen" class="hidden text-center p-8 bg-gray-100 rounded-xl space-y-4">
            <h2 id="result-title" class="text-4xl font-extrabold text-green-700"></h2>
            <p id="revealed-player" class="text-xl font-medium text-gray-800"></p>
            <p id="game-status-summary" class="text-lg text-gray-600"></p>
            
            <button onclick="resetGame()" class="mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
                Chơi Ván Mới
            </button>
        </div>

    </div>
    
    <!-- Player Card Modal (New Feature) -->
    <div id="player-card-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 hidden flex items-center justify-center p-4 z-50 transition-opacity duration-300">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm text-center space-y-4 transform scale-100 transition-transform duration-300">
            <h2 class="text-3xl font-extrabold text-indigo-800">Thẻ Bài Của Bạn</h2>
            <i data-lucide="info" class="w-8 h-8 mx-auto text-indigo-600"></i>
            <p id="modal-your-role" class="text-2xl font-bold p-2 rounded-md inline-block"></p>
            <p class="text-lg text-gray-600">Từ khóa bí mật vòng này là:</p>
            <p id="modal-secret-word" class="text-4xl font-extrabold text-gray-900 bg-yellow-100 p-4 rounded-xl shadow-inner border-b-4 border-yellow-500 inline-block"></p>
            <p id="modal-liar-goal" class="text-sm italic text-red-500"></p>
            
            <button onclick="hidePlayerCard()" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                Đóng
            </button>
        </div>
    </div>

        };
        const ALL_WORDS = Object.values(WORD_LIST).flat();

        // Utility Functions
        function showMessage(text, isError = false) {
            const box = document.getElementById('message-box');
            box.textContent = text;
            box.className = `text-center p-3 my-4 rounded-lg font-medium ${isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            box.classList.remove('hidden');
        }

        function hideAllScreens() {
            ['setup-screen', 'reveal-screen', 'gameplay-screen', 'voting-screen', 'result-screen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById('message-box').classList.add('hidden');
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- FIREBASE INITIALIZATION & AUTH ---
        async function initializeFirebase() {
            try {
                if (Object.keys(firebaseConfig).length === 0) {
                    throw new Error("Firebase config is missing.");
                }

                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                gameRef = doc(db, "artifacts", appId, "public", "data", "liar-game", "main-room");

                // setLogLevel('debug'); // Optional: for debugging

                await setPersistence(auth, browserSessionPersistence);

                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        document.getElementById('room-info').textContent = `Mã người dùng: ${userId}`;
                        setupPlayerInputs(5); // Initial setup
                        listenToGame();
                        document.getElementById('loading').classList.add('hidden');
                    } else {
                        document.getElementById('loading').textContent = "Lỗi: Không thể xác thực người dùng.";
                    }
                });

            } catch (e) {
                console.error("Firebase init error:", e);
                document.getElementById('loading').textContent = `Lỗi khởi tạo: ${e.message}`;
            }
        }

        // --- GAME STATE LISTENER ---
        function listenToGame() {
            if (unsubscribe) {
                unsubscribe();
            }

            unsubscribe = onSnapshot(gameRef, (docSnap) => {
                if (docSnap.exists()) {
                    currentGame = docSnap.data();
                    renderGame(currentGame);
                } else {
                    // Game does not exist, show setup screen
                    currentGame = null;
                    renderSetup(true);
                }
            }, (error) => {
                console.error("Firestore snapshot error:", error);
                showMessage("Lỗi kết nối thời gian thực. Vui lòng tải lại trang.", true);
            });
        }

        // --- UI RENDERING ---
        
        function renderSetup(isNewGame = false) {
            hideAllScreens();
            document.getElementById('setup-screen').classList.remove('hidden');

            const savedPlayers = isNewGame ? [] : (currentGame?.players || []);
            const numPlayers = savedPlayers.length > 0 ? savedPlayers.length : 5;
            document.getElementById('num-players').value = numPlayers;

            setupPlayerInputs(numPlayers, savedPlayers);
        }

        function setupPlayerInputs(count, players = []) {
            const inputContainer = document.getElementById('player-name-inputs');
            inputContainer.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const playerName = players[i]?.name || `Người chơi ${i + 1}`;
                inputContainer.innerHTML += `
                    <div>
                        <label for="name-${i}" class="block text-sm font-medium text-gray-700">Tên người chơi ${i + 1}</label>
                        <input type="text" id="name-${i}" value="${playerName}" placeholder="Nhập tên" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                `;
            }

            document.getElementById('num-players').onchange = (e) => {
                const newCount = parseInt(e.target.value);
                if (newCount >= 3 && newCount <= MAX_PLAYERS) {
                    setupPlayerInputs(newCount);
                }
            };
        }

        function renderGame(state) {
            hideAllScreens();
            
            if (state.status === 'SETUP' || state.status === 'GAME_OVER') {
                document.getElementById('setup-screen').classList.remove('hidden');
                document.getElementById('num-liars').value = state.numLiars;
                document.getElementById('num-players').value = state.players.length;
                setupPlayerInputs(state.players.length, state.players);
                if (state.status === 'GAME_OVER') {
                    renderResult(state.winCondition);
                }
                return;
            }

            const currentPlayer = state.players.find(p => p.id === userId);
            
            // Check if player is assigned to the current game, if not, show setup
            if (!currentPlayer) {
                document.getElementById('setup-screen').classList.remove('hidden');
                showMessage("Bạn chưa tham gia phòng. Vui lòng điền tên và nhấn Bắt đầu Trò chơi.", true);
                return;
            }

            // 1. Render Gameplay Screen
            document.getElementById('gameplay-screen').classList.remove('hidden');
            renderPlayerList(state);
            renderTurnDisplay(state);
            document.getElementById('current-category').textContent = `Chủ đề: ${state.category}`;
            
            // 2. Control flow
            switch (state.status) {
                case 'REVEAL':
                    // This is handled by a local function call in startGame(), no need to show here
                    // If a player joins late, they still see gameplay
                    break;
                case 'PLAYING':
                    document.getElementById('next-turn-btn').disabled = false;
                    document.getElementById('next-turn-btn').textContent = (state.turnIndex === state.players.length - 1) ? "Chuyển sang Bỏ Phiếu" : "Hoàn Thành Miêu Tả (Chuyển Lượt)";
                    // Only the current player can press the button
                    if (state.turnOrder[state.turnIndex] !== userId) {
                         document.getElementById('next-turn-btn').disabled = true;
                         document.getElementById('next-turn-btn').textContent = `Chờ ${state.players.find(p => p.id === state.turnOrder[state.turnIndex])?.name} miêu tả...`;
                    } else {
                        document.getElementById('next-turn-btn').disabled = false;
                    }
                    break;
                case 'VOTING':
                    document.getElementById('gameplay-screen').classList.add('hidden');
                    renderVoting(state);
                    break;
                case 'REVEALING_VOTE':
                    document.getElementById('gameplay-screen').classList.add('hidden');
                    renderResult(state.revealedPlayerId);
                    break;
            }
        }

        function renderPlayerList(state) {
            const listContainer = document.getElementById('player-list');
            listContainer.innerHTML = '';
            const currentPlayerId = state.turnOrder[state.turnIndex];

            state.players.forEach((player, index) => {
                const isTurn = player.id === currentPlayerId && state.status === 'PLAYING';
                const isOut = player.role === 'OUT';
                const isCurrentUser = player.id === userId;
                const clickHandler = isCurrentUser ? `onclick="showPlayerCard()"` : '';
                const roleColor = player.role === 'LIAR' ? 'bg-red-200 text-red-800' : 'bg-green-200 text-green-800';
                
                let statusText = '';
                if (isOut) {
                    statusText = player.finalRole === 'LIAR' ? 'Kẻ Nói Dối' : 'Người Bình Thường';
                }

                listContainer.innerHTML += `
                    <div ${clickHandler} class="p-4 rounded-xl shadow-lg border-2 ${isTurn ? 'border-yellow-500 ring-4 ring-yellow-200 flash' : 'border-gray-200'} ${isOut ? 'opacity-50 line-through' : ''} bg-white transition duration-300 hover:shadow-xl ${isCurrentUser ? 'cursor-pointer' : ''}">
                        <p class="font-bold text-xl text-gray-900">${index + 1}. ${player.name} ${isCurrentUser ? '(Bạn)' : ''}</p>
                        <p class="text-xs text-gray-500 mt-1">ID: ${player.id.substring(0, 8)}...</p>
                        ${isOut ? `<p class="mt-2 text-sm font-semibold p-1 rounded-full ${roleColor}">${statusText} (Đã bị loại)</p>` : `<p class="mt-2 text-sm font-medium text-gray-400">Đang tham gia...</p>`}
                        ${isCurrentUser && state.status !== 'SETUP' && state.status !== 'GAME_OVER' ? '<p class="text-xs text-indigo-500 font-medium mt-2"><i data-lucide="scan-line" class="w-3 h-3 inline mr-1"></i>Xem thẻ bài</p>' : ''}
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function renderTurnDisplay(state) {
            const currentTurnId = state.turnOrder[state.turnIndex];
            const currentPlayer = state.players.find(p => p.id === currentTurnId);
            
            document.getElementById('current-player-turn').textContent = currentPlayer ? currentPlayer.name : 'Đã kết thúc vòng miêu tả';
            
            const turnNames = state.turnOrder.map(id => state.players.find(p => p.id === id)?.name);
            document.getElementById('turn-order-info').textContent = `Thứ tự: ${turnNames.join(' → ')}`;
        }

        function renderVoting(state) {
            document.getElementById('voting-screen').classList.remove('hidden');
            const votingOptions = document.getElementById('voting-options');
            votingOptions.innerHTML = '';

            const availablePlayers = state.players.filter(p => p.role !== 'OUT');
            const currentPlayer = state.players.find(p => p.id === userId);
            
            if (!currentPlayer || currentPlayer.role === 'OUT') {
                document.getElementById('submit-vote-btn').disabled = true;
                document.getElementById('submit-vote-btn').textContent = 'Bạn đã bị loại. Chờ kết quả...';
                return;
            } else {
                document.getElementById('submit-vote-btn').disabled = false;
                document.getElementById('submit-vote-btn').textContent = 'Gửi Phiếu Bầu';
            }

            availablePlayers.forEach(player => {
                if (player.id !== userId) { // Can't vote for yourself
                    votingOptions.innerHTML += `
                        <button onclick="selectVote('${player.id}')" id="vote-btn-${player.id}"
                            class="p-4 rounded-lg shadow-md border-2 border-indigo-200 bg-white text-gray-800 font-medium hover:bg-indigo-100 transition duration-150">
                            ${player.name}
                        </button>
                    `;
                }
            });

            document.getElementById('submit-vote-btn').onclick = submitVote;
        }
        
        function renderResult(resultId) {
             document.getElementById('result-screen').classList.remove('hidden');

             const LiarsFound = currentGame.players.filter(p => p.finalRole === 'LIAR' && p.role === 'OUT').length; // Correctly count Liars that are OUT
             const TotalLiars = currentGame.numLiars;
             const NormalsLeft = currentGame.players.filter(p => p.role === 'NORMAL').length;
             const LiarsLeft = currentGame.players.filter(p => p.role === 'LIAR').length;

             if (currentGame.status === 'GAME_OVER') {
                 // Final result
                 if (currentGame.winCondition === 'NORMAL') {
                    document.getElementById('result-title').textContent = 'NGƯỜI BÌNH THƯỜNG THẮNG CUỘC!';
                    document.getElementById('result-title').classList.remove('text-red-700');
                    document.getElementById('result-title').classList.add('text-green-700');
                 } else {
                    document.getElementById('result-title').textContent = 'KẺ NÓI DỐI THẮNG CUỘC!';
                    document.getElementById('result-title').classList.remove('text-green-700');
                    document.getElementById('result-title').classList.add('text-red-700');
                 }
                 document.getElementById('revealed-player').textContent = `Tất cả đã bị lộ. Từ khóa bí mật: ${currentGame.secretWord}.`; // Secret word only revealed at the end
                 document.getElementById('game-status-summary').innerHTML = `
                    <p>Tổng Liar: ${TotalLiars}. Liar bị tìm thấy: ${LiarsFound}.</p>
                    <p>Cảm ơn các bạn đã tham gia!</p>
                 `;
             } else {
                // Mid-game vote reveal (REVEALING_VOTE)
                const player = currentGame.players.find(p => p.id === resultId);
                const roleText = player.finalRole === 'LIAR' ? 'KẺ NÓI DỐI' : 'NGƯỜI BÌNH THƯỜNG';
                const roleClass = player.finalRole === 'LIAR' ? 'text-red-700' : 'text-green-700';

                document.getElementById('result-title').textContent = `KẾT QUẢ BỎ PHIẾU!`;
                document.getElementById('result-title').classList.remove('text-red-700', 'text-green-700');
                document.getElementById('result-title').classList.add('text-gray-800');

                document.getElementById('revealed-player').innerHTML = `Người bị loại: <span class="font-extrabold ${roleClass}">${player.name}</span>`;
                document.getElementById('game-status-summary').innerHTML = `
                    <p>Vai trò thật sự của ${player.name} là: <span class="font-extrabold text-2xl ${roleClass}">${roleText}</span></p>
                    <p class="mt-4">
                        <span class="text-green-600 font-medium">Người Bình Thường còn lại: ${NormalsLeft}</span> | 
                        <span class="text-red-600 font-medium">Kẻ Nói Dối còn lại: ${LiarsLeft}</span>
                    </p>
                `;
                
                // Remove previous action button before adding new one
                const resultScreen = document.getElementById('result-screen');
                const existingBtn = resultScreen.querySelector('.mt-6.bg-indigo-600');
                if (existingBtn) {
                    existingBtn.remove();
                }

                // Show button to continue or finish
                const nextActionBtn = document.createElement('button');
                nextActionBtn.className = 'mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200';
                
                if (LiarsLeft === 0) {
                    nextActionBtn.textContent = 'Người Bình Thường Thắng - Kết thúc Game';
                    nextActionBtn.onclick = () => endGame('NORMAL');
                } else if (LiarsLeft >= NormalsLeft) {
                    nextActionBtn.textContent = 'Kẻ Nói Dối Thắng - Kết thúc Game';
                    nextActionBtn.onclick = () => endGame('LIAR');
                } else {
                    nextActionBtn.textContent = 'Tiếp tục vòng mới (Random lại lượt)';
                    nextActionBtn.onclick = continueGame;
                }
                
                resultScreen.appendChild(nextActionBtn);
             }
        }
        
        // --- PLAYER CARD MODAL FUNCTIONS (New Feature) ---
        window.showPlayerCard = () => {
            if (!currentGame || (currentGame.status !== 'PLAYING' && currentGame.status !== 'VOTING')) {
                showMessage("Không thể xem thẻ bài lúc này.", true);
                return;
            }

            const player = currentGame.players.find(p => p.id === userId);
            if (!player) return;

            const modal = document.getElementById('player-card-modal');
            const roleEl = document.getElementById('modal-your-role');
            const wordEl = document.getElementById('modal-secret-word');
            const goalEl = document.getElementById('modal-liar-goal');

            const isLiar = player.role === 'LIAR';
            
            // Update content
            roleEl.textContent = isLiar ? 'KẺ NÓI DỐI' : 'NGƯỜI BÌNH THƯỜNG';
            roleEl.className = `text-2xl font-bold p-2 rounded-md inline-block ${isLiar ? 'bg-red-500 text-white shadow-xl' : 'bg-green-500 text-white shadow-xl'}`;
            wordEl.textContent = isLiar ? '??? (CỐ GẮNG ĐOÁN TỪ)' : currentGame.secretWord;
            
            if (isLiar) {
                goalEl.textContent = 'Mục tiêu: Đừng để bị phát hiện và cố gắng đoán từ khóa thật qua lời miêu tả của người khác!';
                goalEl.classList.remove('hidden');
            } else {
                goalEl.classList.add('hidden');
            }

            // Show modal
            modal.classList.remove('hidden');
            lucide.createIcons();
        };

        window.hidePlayerCard = () => {
            document.getElementById('player-card-modal').classList.add('hidden');
        };
        // --- END PLAYER CARD MODAL FUNCTIONS ---

        // --- GAME ACTIONS ---

        // Called by button
        window.startGame = async () => {
            if (!userId) { showMessage("Lỗi xác thực người dùng.", true); return; }

            const numPlayers = parseInt(document.getElementById('num-players').value);
            const numLiars = parseInt(document.getElementById('num-liars').value);
            const errorElement = document.getElementById('setup-error');

            const names = [];
            for (let i = 0; i < numPlayers; i++) {
                const name = document.getElementById(`name-${i}`).value.trim();
                names.push(name || `Người chơi ${i + 1}`);
            }

            if (numPlayers < 3 || numPlayers > MAX_PLAYERS) { errorElement.textContent = "Số người chơi phải từ 3 đến 15."; errorElement.classList.remove('hidden'); return; }
            if (numLiars < 1 || numLiars >= numPlayers - numLiars) { errorElement.textContent = "Số lượng Kẻ nói dối không hợp lệ (nên ít hơn số người bình thường)."; errorElement.classList.remove('hidden'); return; }
            errorElement.classList.add('hidden');

            const allWords = ALL_WORDS;
            const secretWord = allWords[Math.floor(Math.random() * allWords.length)];
            const category = Object.keys(WORD_LIST).find(cat => WORD_LIST[cat].includes(secretWord)) || 'Hỗn hợp';

            let players = names.map((name, index) => ({
                id: crypto.randomUUID(), // Unique ID for the player within this game
                name: name,
                role: 'NORMAL',
                finalRole: 'NORMAL', // Used only after being voted out
                vote: null,
                isHost: index === 0, // First player is host, can start
            }));

            // Assign Liar roles
            let liarIndices = shuffleArray([...Array(numPlayers).keys()]).slice(0, numLiars);
            liarIndices.forEach(i => { players[i].role = 'LIAR'; players[i].finalRole = 'LIAR'; });

            // Randomize turn order for the first round
            const turnOrder = shuffleArray(players.map(p => p.id));

            const newGame = {
                status: 'PLAYING', // Start directly into playing after local reveal
                players: players,
                secretWord: secretWord,
                category: category,
                numLiars: numLiars,
                turnOrder: turnOrder,
                turnIndex: 0,
                votes: {}, // { playerId: [votedForId, ...] }
                winCondition: null // NORMAL or LIAR
            };
            
            try {
                // Use a generic ID for the room since it's a single collaborative document
                await setDoc(gameRef, newGame);
                // Immediately show reveal screen locally (Firestore listener will handle global state)
                showRevealScreen(newGame);
            } catch (error) {
                console.error("Error starting game:", error);
                showMessage("Lỗi khi bắt đầu trò chơi. Vui lòng thử lại.", true);
            }
        };

        // Called by local button click
        window.showRevealScreen = (state) => {
            hideAllScreens();
            const player = state.players.find(p => p.id === userId) || state.players[0]; // Fallback for host during setup

            if (!player) return; // Should not happen

            document.getElementById('reveal-screen').classList.remove('hidden');
            const roleEl = document.getElementById('your-role');
            const wordEl = document.getElementById('secret-word');
            const goalEl = document.getElementById('liar-goal');
            
            const isLiar = player.role === 'LIAR';
            roleEl.textContent = isLiar ? 'KẺ NÓI DỐI' : 'NGƯỜI BÌNH THƯỜNG';
            roleEl.className = `text-2xl font-bold p-2 rounded-md inline-block ${isLiar ? 'bg-red-500 text-white shadow-xl' : 'bg-green-500 text-white shadow-xl'}`;
            wordEl.textContent = isLiar ? '??? (CỐ GẮNG ĐOÁN TỪ)' : state.secretWord;
            
            if (isLiar) {
                goalEl.textContent = 'Mục tiêu: Đừng để bị phát hiện và cố gắng đoán từ khóa thật qua lời miêu tả của người khác!';
                goalEl.classList.remove('hidden');
            } else {
                goalEl.classList.add('hidden');
            }
        }
        
        // Called by local button click
        window.hideRevealScreen = () => {
             document.getElementById('reveal-screen').classList.add('hidden');
             // The Firestore listener will automatically render the gameplay screen
        }

        // Called by button
        window.nextTurn = async () => {
            if (!currentGame || currentGame.status !== 'PLAYING') return;

            const currentTurnId = currentGame.turnOrder[currentGame.turnIndex];
            if (currentTurnId !== userId) {
                showMessage("Chưa đến lượt bạn. Vui lòng chờ.", true);
                return;
            }

            const nextIndex = currentGame.turnIndex + 1;
            
            try {
                await runTransaction(db, async (transaction) => {
                    const doc = await transaction.get(gameRef);
                    if (!doc.exists()) { throw "Document does not exist!"; }
                    
                    const state = doc.data();
                    
                    // Only continue if current user is still active
                    const activePlayerIds = state.players.filter(p => p.role !== 'OUT').map(p => p.id);
                    const currentActiveTurnOrder = state.turnOrder.filter(id => activePlayerIds.includes(id));
                    
                    if (state.turnIndex >= currentActiveTurnOrder.length) {
                        throw "Turn index out of bounds or turn order not refreshed.";
                    }

                    if (nextIndex < currentActiveTurnOrder.length) {
                        // Continue playing
                        transaction.update(gameRef, { turnIndex: nextIndex });
                    } else {
                        // End of descriptions, move to voting
                        transaction.update(gameRef, { status: 'VOTING', turnIndex: 0 }); // Reset index for voting round (optional)
                    }
                });
            } catch (error) {
                console.error("Transaction failed:", error);
                showMessage("Lỗi chuyển lượt. Vui lòng thử lại.", true);
            }
        };
        
        // Voting logic
        let selectedVoteId = null;

        window.selectVote = (votedForId) => {
            selectedVoteId = votedForId;
            document.querySelectorAll('#voting-options button').forEach(btn => {
                btn.classList.remove('border-4', 'border-red-500', 'bg-red-100');
            });
            document.getElementById(`vote-btn-${votedForId}`).classList.add('border-4', 'border-red-500', 'bg-red-100');
        };

        window.submitVote = async () => {
            if (!currentGame || currentGame.status !== 'VOTING') return;
            if (!selectedVoteId) { showMessage("Vui lòng chọn một người để bỏ phiếu.", true); return; }

            const votes = currentGame.votes || {};

            try {
                await runTransaction(db, async (transaction) => {
                    const doc = await transaction.get(gameRef);
                    if (!doc.exists()) { throw "Document does not exist!"; }
                    
                    const state = doc.data();
                    
                    // Prevent double voting
                    const currentVotes = state.votes || {};
                    if (currentVotes[userId]) return; 

                    currentVotes[userId] = selectedVoteId;
                    
                    // Check if all active players have voted
                    const activePlayers = state.players.filter(p => p.role !== 'OUT');
                    const activeVoterIds = activePlayers.map(p => p.id).filter(id => id !== userId); // All active players except current user (who just voted)
                    const votedPlayers = Object.keys(currentVotes).length;
                    
                    transaction.update(gameRef, { votes: currentVotes });

                    if (votedPlayers === activePlayers.length) {
                        // All voted, calculate result
                        const voteCounts = {};
                        Object.values(currentVotes).forEach(votedId => {
                            voteCounts[votedId] = (voteCounts[votedId] || 0) + 1;
                        });

                        // Find the player with max votes
                        let maxVotes = 0;
                        let votedOutId = null;
                        for (const id in voteCounts) {
                            if (voteCounts[id] > maxVotes) {
                                maxVotes = voteCounts[id];
                                votedOutId = id;
                            }
                        }
                        
                        // If there's a tie, choose randomly among the tied highest vote counts
                        let tiedCandidates = Object.keys(voteCounts).filter(id => voteCounts[id] === maxVotes);
                        votedOutId = tiedCandidates[Math.floor(Math.random() * tiedCandidates.length)];

                        // Update player role and status
                        const updatedPlayers = state.players.map(p => {
                            if (p.id === votedOutId) {
                                return { ...p, role: 'OUT' }; // Mark as OUT for the next round
                            }
                            return p;
                        });

                        transaction.update(gameRef, {
                            players: updatedPlayers,
                            status: 'REVEALING_VOTE',
                            revealedPlayerId: votedOutId,
                            votes: {}, // Clear votes for next round
                        });
                    }
                });
            } catch (error) {
                console.error("Transaction failed:", error);
                showMessage("Lỗi gửi phiếu bầu. Vui lòng thử lại.", true);
            }
        };
        
        // Continue Game after vote reveal
        window.continueGame = async () => {
            if (!currentGame || currentGame.status !== 'REVEALING_VOTE') return;

            const activePlayers = currentGame.players.filter(p => p.role !== 'OUT');
            const turnOrder = shuffleArray(activePlayers.map(p => p.id));

            try {
                await setDoc(gameRef, {
                    ...currentGame,
                    status: 'PLAYING',
                    turnOrder: turnOrder,
                    turnIndex: 0,
                    revealedPlayerId: null, // Clear revealed info
                });
            } catch (error) {
                console.error("Error continuing game:", error);
                showMessage("Lỗi khi tiếp tục trò chơi. Vui lòng thử lại.", true);
            }
        };

        // End Game
        window.endGame = async (winCondition) => {
             if (!currentGame) return;
             try {
                await setDoc(gameRef, {
                    ...currentGame,
                    status: 'GAME_OVER',
                    winCondition: winCondition,
                    revealedPlayerId: null,
                });
            } catch (error) {
                console.error("Error ending game:", error);
                showMessage("Lỗi khi kết thúc trò chơi. Vui lòng thử lại.", true);
            }
        }
        
        // Reset Game
        window.resetGame = async () => {
             if (!currentGame) return;
             // Set status to SETUP to allow new game configuration
             try {
                await setDoc(gameRef, {
                    status: 'SETUP',
                    players: [],
                    numLiars: 1,
                    secretWord: null,
                    category: null,
                    turnOrder: [],
                    turnIndex: 0,
                    votes: {},
                    winCondition: null
                });
            } catch (error) {
                console.error("Error resetting game:", error);
                showMessage("Lỗi khi đặt lại trò chơi. Vui lòng thử lại.", true);
            }
        }

        // --- START APP ---
        window.onload = initializeFirebase;
    </script>
</body>
</html>
